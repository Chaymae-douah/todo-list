name: Security Checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Show frontend dependency versions
        run: |
          cd frontend
          npm ls vite esbuild

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=moderate

      - name: Build backend image
        run: docker build -t docker-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t todo-frontend:latest ./frontend

      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "docker-backend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: "todo-frontend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
